name: CI/CD Pipeline - Usuarios API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # FASE 1: INTEGRACIÓN CONTINUA (CI) - TESTS Y COBERTURA
  # ==========================================
  test:
    name: Pruebas Automatizadas y Cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias y verificar cobertura (umbral 70%)
        run: npm test

  # ==========================================
  # FASE 2: GESTIÓN DE ARTEFACTOS - DOCKER BUILD & PUSH
  # ==========================================
  build-and-push:
    name: Compilar y Publicar Imagen Docker
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticación en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compilar y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/usuarios-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/usuarios-api:${{ github.sha }}

  # ==========================================
  # FASE 3: DESPLIEGUE CONTINUO (CD) - AWS EC2
  # ==========================================
  deploy:
    name: Despliegue en AWS EC2
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en servidor AWS EC2 mediante SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo ">>> Iniciando despliegue de usuarios-api..."
            
            # Iniciar sesión en Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # Descargar imagen más reciente
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/usuarios-api:latest
            
            # Detener y remover contenedor previo si existe
            docker stop usuarios-api || true
            docker rm usuarios-api || true
            
            # Iniciar nuevo contenedor mapeado al puerto 80
            docker run -d \
              --name usuarios-api \
              --restart unless-stopped \
              -p 80:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/usuarios-api:latest
            
            # Limpiar imágenes obsoletas
            docker image prune -f
            
            echo ">>> Despliegue completado con éxito en el puerto 80."
