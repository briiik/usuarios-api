name: CI/CD Pipeline - Usuarios API con Observabilidad y Playwright

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # FASE 1: INTEGRACIÓN CONTINUA (CI) - TESTS JEST Y PLAYWRIGHT
  # ==========================================
  test:
    name: Pruebas Automatizadas (Jest + Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias Node.js
        run: npm ci

      - name: Ejecutar pruebas unitarias y verificar cobertura (umbral 70%)
        run: npm test

      - name: Configurar Python 3.13 para Playwright
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias de pruebas E2E (pytest, playwright, pytest-html)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html pytest-playwright requests psutil
          playwright install --with-deps chromium

      - name: Iniciar servidor en segundo plano para pruebas E2E
        run: |
          node src/server.js &
          sleep 4

      - name: Ejecutar pruebas de extremo a extremo con Playwright
        run: |
          python -m pytest tests_e2e --html=reporte_playwright_usuarios.html --self-contained-html -v

      - name: Subir artefacto de reporte Playwright HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-playwright-html
          path: reporte_playwright_usuarios.html

      # RF-03: Notificación de ÉXITO de pruebas a OpenObserve
      - name: Registrar ÉXITO de pruebas en OpenObserve
        if: success()
        run: |
          if [ -n "${{ secrets.OPENOBSERVE_AUTH }}" ] && [ -n "${{ secrets.OPENOBSERVE_ENDPOINT }}" ]; then
            curl -s -X POST "${{ secrets.OPENOBSERVE_ENDPOINT }}/api/${{ secrets.OPENOBSERVE_ORG || 'default' }}/pipeline_ci_logs/_json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Basic ${{ secrets.OPENOBSERVE_AUTH }}" \
              -d '[{
                "evento": "CI_PRUEBAS_APROBADAS",
                "estado": "SUCCESS",
                "commit": "${{ github.sha }}",
                "rama": "${{ github.ref_name }}",
                "autor": "${{ github.actor }}",
                "mensaje": "Todas las pruebas unitarias y de Playwright pasaron exitosamente",
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]' || true
          else
            echo "[INFO] Credenciales de OpenObserve no configuradas; omitiendo telemetría remota."
          fi

      # RF-03: Notificación de FALLO de pruebas a OpenObserve (Criterio 1: Bloquea despliegue)
      - name: Registrar FALLO de pruebas en OpenObserve
        if: failure()
        run: |
          if [ -n "${{ secrets.OPENOBSERVE_AUTH }}" ] && [ -n "${{ secrets.OPENOBSERVE_ENDPOINT }}" ]; then
            curl -s -X POST "${{ secrets.OPENOBSERVE_ENDPOINT }}/api/${{ secrets.OPENOBSERVE_ORG || 'default' }}/pipeline_ci_logs/_json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Basic ${{ secrets.OPENOBSERVE_AUTH }}" \
              -d '[{
                "evento": "CI_PRUEBAS_FALLIDAS",
                "estado": "FAILED",
                "commit": "${{ github.sha }}",
                "rama": "${{ github.ref_name }}",
                "autor": "${{ github.actor }}",
                "mensaje": "Fallo detectado en las pruebas. Despliegue condicionado cancelado.",
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]' || true
          fi

  # ==========================================
  # FASE 2: GESTIÓN DE ARTEFACTOS - DOCKER BUILD & PUSH
  # ==========================================
  build-and-push:
    name: Compilar y Publicar Imagen Docker
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticación en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compilar y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/usuarios-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/usuarios-api:${{ github.sha }}

  # ==========================================
  # FASE 3: DESPLIEGUE CONTINUO (CD) CONDICIONADO - AWS EC2
  # ==========================================
  deploy:
    name: Despliegue en AWS EC2 y Registro OpenObserve
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en servidor AWS EC2 mediante SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo ">>> Iniciando despliegue de usuarios-api..."
            
            # Iniciar sesión en Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # Descargar imagen más reciente
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/usuarios-api:latest
            
            # Detener y remover contenedor previo si existe
            docker stop usuarios-api || true
            docker rm usuarios-api || true
            
            # Iniciar nuevo contenedor mapeado al puerto 80
            docker run -d \
              --name usuarios-api \
              --restart unless-stopped \
              -p 80:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/usuarios-api:latest
            
            # Limpiar imágenes obsoletas
            docker image prune -f
            
            echo ">>> Despliegue completado con éxito en el puerto 80."

      # RF-03 & Criterio 2: Registrar evento de despliegue completado en OpenObserve
      - name: Registrar despliegue exitoso en OpenObserve
        if: success()
        run: |
          if [ -n "${{ secrets.OPENOBSERVE_AUTH }}" ] && [ -n "${{ secrets.OPENOBSERVE_ENDPOINT }}" ]; then
            curl -s -X POST "${{ secrets.OPENOBSERVE_ENDPOINT }}/api/${{ secrets.OPENOBSERVE_ORG || 'default' }}/deploy_events/_json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Basic ${{ secrets.OPENOBSERVE_AUTH }}" \
              -d '[{
                "evento": "CD_DESPLIEGUE_EXITOSO",
                "estado": "SUCCESS",
                "servidor": "AWS-EC2",
                "ip_host": "${{ secrets.EC2_HOST }}",
                "puerto": 80,
                "commit": "${{ github.sha }}",
                "imagen": "${{ secrets.DOCKERHUB_USERNAME }}/usuarios-api:latest",
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]' || true
          fi
